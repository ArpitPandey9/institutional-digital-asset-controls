[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "institutional-digital-asset-controls"
version = "0.1.0"
description = "Stablecoin settlement assurance, reconciliation, and controls using real on-chain evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.64,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
